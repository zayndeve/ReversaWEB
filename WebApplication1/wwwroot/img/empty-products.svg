<!--?xml version="1.0" encoding="UTF-8"?-->
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="No product image">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f8"></stop>
      <stop offset="1" stop-color="#e5e7eb"></stop>
    </linearGradient>
    <clipPath id="r">
      <rect x="40" y="40" width="720" height="720" rx="36"></rect>
    </clipPath>
  </defs>

  <!-- Card -->
  <rect x="40" y="40" width="720" height="720" rx="36" fill="url(#g)"></rect>

  <!-- Pattern background -->
  <g clip-path="url(#r)" opacity="0.4">
    <circle cx="120" cy="120" r="4" fill="#d1d5db"></circle>
    <circle cx="240" cy="120" r="4" fill="#d1d5db"></circle>
    <circle cx="360" cy="120" r="4" fill="#d1d5db"></circle>
    <circle cx="480" cy="120" r="4" fill="#d1d5db"></circle>
    <circle cx="600" cy="120" r="4" fill="#d1d5db"></circle>
    <circle cx="720" cy="120" r="4" fill="#d1d5db"></circle>
    <circle cx="120" cy="240" r="4" fill="#d1d5db"></circle>
    <circle cx="240" cy="240" r="4" fill="#d1d5db"></circle>
    <circle cx="360" cy="240" r="4" fill="#d1d5db"></circle>
    <circle cx="480" cy="240" r="4" fill="#d1d5db"></circle>
    <circle cx="600" cy="240" r="4" fill="#d1d5db"></circle>
    <circle cx="720" cy="240" r="4" fill="#d1d5db"></circle>
    <circle cx="120" cy="360" r="4" fill="#d1d5db"></circle>
    <circle cx="240" cy="360" r="4" fill="#d1d5db"></circle>
    <circle cx="360" cy="360" r="4" fill="#d1d5db"></circle>
    <circle cx="480" cy="360" r="4" fill="#d1d5db"></circle>
    <circle cx="600" cy="360" r="4" fill="#d1d5db"></circle>
    <circle cx="720" cy="360" r="4" fill="#d1d5db"></circle>
  </g>

  <!-- Camera/Product icon -->
  <g transform="translate(200,200)">
    <rect x="0" y="60" width="400" height="280" rx="24" fill="#cbd5e1"></rect>
    <rect x="36" y="36" width="96" height="48" rx="12" fill="#cbd5e1"></rect>
    <circle cx="260" cy="200" r="70" fill="#e5e7eb" stroke="#9ca3af" stroke-width="8"></circle>
    <circle cx="260" cy="200" r="28" fill="#9ca3af"></circle>
    <path d="M80,280 L150,200 L210,250 L260,200 L320,260 L360,220 L360,300 L80,300 Z" fill="#9ca3af" opacity="0.6"></path>
  </g>

  <!-- Text -->
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" text-anchor="middle">
    <text x="400" y="620" font-size="36" fill="#374151" font-weight="600">No Image</text>
    <text x="400" y="660" font-size="24" fill="#6b7280">Image not available</text>
  </g>
</svg>
